apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sre-atlas-netpol
  namespace: wiki
  labels:
    app: sre-atlas
spec:
  podSelector:
    matchLabels:
      app: sre-atlas
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress controller (verify namespace matches your cluster)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
  egress:
    # Allow DNS queries
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
