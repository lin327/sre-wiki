site_name: SRE Atlas
site_description: AI 驱动的运维知识库，覆盖 Linux → Docker → Kubernetes 全链路
site_url: https://wiki.tentative.me
repo_url: https://github.com/lin327/sre-wiki

docs_dir: wiki/zh
site_dir: site

theme:
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: blue grey
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
    - scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - ezlinks:
      wikilinks: true
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  - mermaid2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Linux:
    - linux/index.md
    - 进程模型: linux/process-model.md
    - 文件系统: linux/filesystem.md
    - 网络栈: linux/network-stack.md
    - systemd: linux/systemd.md
  - Docker:
    - docker/index.md
    - 镜像分层: docker/image-layers.md
    - 网络模式: docker/networking.md
    - 存储驱动: docker/storage.md
    - Compose: docker/compose.md
  - Kubernetes:
    - kubernetes/index.md
    - Pod 生命周期: kubernetes/pod-lifecycle.md
    - 容器运行时: kubernetes/container-runtime.md
    - Service Mesh: kubernetes/service-mesh.md
  - Runbook:
    - runbooks/index.md
    - CrashLoopBackOff: runbooks/crashloopbackoff.md
    - OOMKilled: runbooks/oomkilled.md
    - ImagePullBackOff: runbooks/imagepullbackoff.md
  - Architecture:
    - architectures/index.md
    - 高可用集群: architectures/ha-cluster.md
    - GitOps: architectures/gitops-pipeline.md
  - Incidents:
    - incidents/index.md
    - etcd 数据损坏: incidents/etcd-data-corruption.md
    - DNS 解析失败: incidents/dns-resolution-failure.md
  - Comparisons:
    - comparisons/index.md
    - Helm vs Kustomize: comparisons/helm-vs-kustomize.md
    - Istio vs Linkerd: comparisons/istio-vs-linkerd.md
