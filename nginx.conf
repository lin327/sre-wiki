server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Gzip ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---------- Long-lived cache for hashed/static assets ----------
    # Fonts
    location ~* \.(woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images
    location ~* \.(png|jpe?g|gif|webp|avif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS and JS
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- SPA / Astro directory-style fallback ----------
    # If a directory is requested and no trailing slash redirect exists,
    # serve index.html from that directory (Astro static output convention).
    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }

    # ---------- Security headers ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable access log for common static file types to reduce noise
    location ~* \.(css|js|woff2?|png|jpe?g|gif|webp|avif|ico|svg)$ {
        access_log off;
    }
}
