<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- SRE Atlas favicon — cobalt blue compass rose -->
  <circle cx="16" cy="16" r="15" fill="#4a6fa5" stroke="#3a5a8a" stroke-width="1"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#5a7fb5" stroke-width="0.6" opacity="0.5"/>
  <!-- N arrow (primary) -->
  <polygon points="16,3.5 18.2,12 16,10.5 13.8,12" fill="#e8edf3"/>
  <!-- S arrow -->
  <polygon points="16,28.5 13.8,20 16,21.5 18.2,20" fill="#8ab0d4" opacity="0.7"/>
  <!-- E arrow -->
  <polygon points="28.5,16 20,13.8 21.5,16 20,18.2" fill="#8ab0d4" opacity="0.7"/>
  <!-- W arrow -->
  <polygon points="3.5,16 12,18.2 10.5,16 12,13.8" fill="#8ab0d4" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#e8edf3"/>
</svg>
